<script>
/* ===== ULTRA SMOOTH AUTO + DRAG SCROLL ===== */

const wrapper = document.querySelector(".scroll-wrapper");
const track = document.querySelector(".scroll-track");

// Duplicate for seamless infinite loop
track.innerHTML += track.innerHTML;

let autoSpeed = 1.5; // Speed control
let isInteracting = false;
let isDown = false;
let startX;
let scrollLeft;

function autoScroll() {
  if (!isInteracting) {
    wrapper.scrollLeft += autoSpeed;

    if (wrapper.scrollLeft >= track.scrollWidth / 2) {
      wrapper.scrollLeft = 0;
    }
  }
  requestAnimationFrame(autoScroll);
}

autoScroll();

/* Stop on hover / touch */
wrapper.addEventListener("mouseenter", () => isInteracting = true);
wrapper.addEventListener("mouseleave", () => isInteracting = false);
wrapper.addEventListener("touchstart", () => isInteracting = true);
wrapper.addEventListener("touchend", () => isInteracting = false);

/* Drag Desktop */
wrapper.addEventListener("mousedown", (e) => {
  isDown = true;
  isInteracting = true;
  startX = e.pageX - wrapper.offsetLeft;
  scrollLeft = wrapper.scrollLeft;
  wrapper.style.cursor = "grabbing";
});

wrapper.addEventListener("mouseup", () => {
  isDown = false;
  isInteracting = false;
  wrapper.style.cursor = "grab";
});

wrapper.addEventListener("mousemove", (e) => {
  if (!isDown) return;
  e.preventDefault();
  const x = e.pageX - wrapper.offsetLeft;
  const walk = (x - startX) * 1.8;
  wrapper.scrollLeft = scrollLeft - walk;
});

/* Drag Mobile */
wrapper.addEventListener("touchmove", (e) => {
  if (!isInteracting) return;
  const x = e.touches[0].pageX - wrapper.offsetLeft;
  const walk = (x - startX) * 1.8;
  wrapper.scrollLeft = scrollLeft - walk;
}, { passive: true });
</script>
