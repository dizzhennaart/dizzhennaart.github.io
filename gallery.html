<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dizz Henna Art – Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Dizz Henna Art offers professional Arabic, wedding and special function mehandhi services in Melur and Madurai. Beautiful natural henna designs for every occasion.">
<meta name="keywords" content="Dizz Henna Art, Mehandhi Artist in Melur, Henna Artist Madurai, Bridal Mehandhi, Arabic Mehandhi">
<meta name="author" content="Dizz Henna Art">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:#f5e6d3;
  color:#4b2e1f;
}

header{
  background:#6f4e37;
  padding:2px;
  text-align:center;
}
header h1{color:#fff5e1;margin:0;}
header p{color:#f5e6d3;margin-top:3px;}

*{margin:0;padding:0;box-sizing:border-box;}

.navbar{
  background:#6b4a2d;
  padding:10px 40px;
}
.menu{
  list-style:none;
  display:flex;
  gap:30px;
  justify-content:center;
}
.menu li{position:relative;}
.menu a{
  color:#fff;
  text-decoration:none;
  font-size:18px;
  padding:10px 0;
  display:block;
}

.submenu{
  display:none;
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  background:#7a5432;
  min-width:200px;
  box-shadow:0 6px 12px rgba(0,0,0,0.3);
  border-radius:4px;
  z-index:1000;
}
.submenu li{
  border-bottom:1px solid #8b623e;
}
.submenu li:last-child{border-bottom:none;}
.submenu a{padding:12px 15px;color:#fff;}
.submenu a:hover{background:#9c6b43;}
.dropdown:hover .submenu{display:block;}

.title{
  text-align:center;
  font-size:32px;
  margin:40px 0 30px;
  color:#5a3a22;
}

/* SCROLL GALLERY */
.scroll-wrapper{
  overflow-x:auto;
  scroll-behavior:smooth;
  padding:20px 40px 60px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  cursor:grab;
}
.scroll-wrapper::-webkit-scrollbar{display:none;}

.scroll-track{
  display:flex;
  gap:30px;
  width:max-content;
}

.card img{
  width:280px;
  height:380px;
  object-fit:cover;
  border-radius:22px;
  cursor:zoom-in;
  box-shadow:0 18px 35px rgba(90,58,34,0.35);
  transition:.4s;
}
.card img:hover{transform:scale(1.05);}

/* ZOOM */
#zoomModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(40,22,12,.95);
  z-index:999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
#zoomModal img{
  max-width:85%;
  max-height:85%;
  transition:transform 0.3s;
}
#close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:#fff;
  cursor:pointer;
}
.controls button{
  margin:10px 6px;
  font-size:22px;
  padding:10px 18px;
  border:none;
  border-radius:50%;
  background:#c49b63;
  color:#3a2416;
  cursor:pointer;
}
#prev,#next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:50px;
  color:#fff;
  background:rgba(0,0,0,0.3);
  border:none;
  padding:10px 20px;
  cursor:pointer;
  border-radius:8px;
}
#prev{left:30px;}
#next{right:30px;}

@media(max-width:768px){
  .card img{width:220px;height:300px;}
}
</style>
</head>

<body>

<header>
  <h1>Dizz Henna Art</h1>
  <p>Mehandhi Artist | Melur & Madurai</p>
</header>

<nav class="navbar">
  <ul class="menu">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li class="dropdown">
      <a href="#">Services ▾</a>
      <ul class="submenu">
        <li><a href="#">Bridal Mehandi</a></li>
        <li><a href="#">Engagement Mehandi</a></li>
        <li><a href="#">Party Mehandi</a></li>
        <li><a href="#">Arabic Mehandi</a></li>
      </ul>
    </li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<h2 class="title">Our Latest Works</h2>

<div class="scroll-wrapper" id="wrapper">
  <div class="scroll-track" id="track">

    <!-- ORIGINAL -->
    <div class="card"><img src="Images/design1.png"></div>
    <div class="card"><img src="Images/design2.png"></div>
    <div class="card"><img src="Images/design3.png"></div>
    <div class="card"><img src="Images/design4.png"></div>
    <div class="card"><img src="Images/design5.png"></div>
    <div class="card"><img src="Images/design6.png"></div>
    <div class="card"><img src="Images/design7.png"></div>
    <div class="card"><img src="Images/design8.png"></div>
    <div class="card"><img src="Images/design9.png"></div>

    <!-- DUPLICATE FOR LOOP -->
    <div class="card"><img src="Images/design1.png"></div>
    <div class="card"><img src="Images/design2.png"></div>
    <div class="card"><img src="Images/design3.png"></div>
    <div class="card"><img src="Images/design4.png"></div>
    <div class="card"><img src="Images/design5.png"></div>
    <div class="card"><img src="Images/design6.png"></div>
    <div class="card"><img src="Images/design7.png"></div>
    <div class="card"><img src="Images/design8.png"></div>
    <div class="card"><img src="Images/design9.png"></div>

  </div>
</div>

<div id="zoomModal">
  <span id="close">&times;</span>
  <button id="prev">&#8249;</button>
  <button id="next">&#8250;</button>
  <img id="zoomImg">
  <div class="controls">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">−</button>
  </div>
</div>

<script>
/* AUTO SCROLL */
const wrapper=document.getElementById("wrapper");
const track=document.getElementById("track");

let speed=0.6;
let animationId;

function autoScroll(){
  wrapper.scrollLeft+=speed;
  if(wrapper.scrollLeft>=track.scrollWidth/2){
    wrapper.scrollLeft=0;
  }
  animationId=requestAnimationFrame(autoScroll);
}
autoScroll();

/* MOUSE DRAG */
let isDown=false;
let startX;
let scrollLeft;

wrapper.addEventListener("mousedown",(e)=>{
  isDown=true;
  wrapper.style.cursor="grabbing";
  cancelAnimationFrame(animationId);
  startX=e.pageX;
  scrollLeft=wrapper.scrollLeft;
});

wrapper.addEventListener("mousemove",(e)=>{
  if(!isDown) return;
  e.preventDefault();
  const walk=e.pageX-startX;
  wrapper.scrollLeft=scrollLeft-walk;
});

wrapper.addEventListener("mouseup",()=>{
  isDown=false;
  wrapper.style.cursor="grab";
  autoScroll();
});

wrapper.addEventListener("mouseleave",()=>{
  if(!isDown) return;
  isDown=false;
  wrapper.style.cursor="grab";
  autoScroll();
});

/* TOUCH */
wrapper.addEventListener("touchstart",(e)=>{
  cancelAnimationFrame(animationId);
  startX=e.touches[0].pageX;
  scrollLeft=wrapper.scrollLeft;
});
wrapper.addEventListener("touchmove",(e)=>{
  const walk=e.touches[0].pageX-startX;
  wrapper.scrollLeft=scrollLeft-walk;
});
wrapper.addEventListener("touchend",()=>autoScroll());

/* ZOOM */
let scale=1;
const modal=document.getElementById("zoomModal");
const modalImg=document.getElementById("zoomImg");
const images=document.querySelectorAll(".card img");
let currentIndex=0;

images.forEach((img,index)=>{
  img.addEventListener("click",()=>{
    currentIndex=index;
    modal.style.display="flex";
    modalImg.src=img.src;
    scale=1;
    modalImg.style.transform="scale(1)";
  });
});

document.getElementById("close").onclick=()=>modal.style.display="none";

function zoomIn(){scale+=.2;modalImg.style.transform=`scale(${scale})`;}
function zoomOut(){scale=Math.max(1,scale-.2);modalImg.style.transform=`scale(${scale})`;}

document.getElementById("next").onclick=()=>{
  currentIndex=(currentIndex+1)%images.length;
  modalImg.src=images[currentIndex].src;
  scale=1;
  modalImg.style.transform="scale(1)";
};
document.getElementById("prev").onclick=()=>{
  currentIndex=(currentIndex-1+images.length)%images.length;
  modalImg.src=images[currentIndex].src;
  scale=1;
  modalImg.style.transform="scale(1)";
};
</script>

</body>
</html>
