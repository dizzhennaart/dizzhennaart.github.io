<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #f6efe8;
}

/* TITLE */
.gallery-title {
  text-align: center;
  margin: 40px 0 25px;
  font-size: 32px;
  color: #5a3a22;
  letter-spacing: 1px;
}

/* GALLERY */
.gallery {
  display: flex;
  gap: 28px;
  padding: 40px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}

.gallery::-webkit-scrollbar {
  display: none;
}

.gallery img {
  height: 360px;
  border-radius: 18px;
  scroll-snap-align: center;
  cursor: zoom-in;
  transition: transform 0.45s ease, box-shadow 0.45s ease;
}

.gallery img:hover {
  transform: scale(1.06);
  box-shadow: 0 18px 35px rgba(0,0,0,0.25);
}

/* ZOOM MODAL */
#zoomModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 999;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#zoomModal img {
  max-width: 85%;
  max-height: 85%;
  transition: transform 0.3s ease;
}

#closeZoom {
  position: absolute;
  top: 25px;
  right: 35px;
  font-size: 40px;
  color: #fff;
  cursor: pointer;
}

.zoom-controls {
  margin-top: 15px;
}

.zoom-controls button {
  font-size: 22px;
  padding: 10px 18px;
  margin: 0 8px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  background: #c49b63;
  color: #fff;
}

/* MOBILE */
@media(max-width: 768px) {
  .gallery img {
    height: 250px;
  }
}
</style>
</head>

<body>

  <header>
    <h1>Dizz Henna Art</h1>
    <p>Mehandhi Artist | Melur & Madurai</p>
</header>

	<nav class="navbar">
  <ul class="menu">

        <li><a href="#">Party Mehandi</a></li>
        <li><a href="#">Arabic Mehandi</a></li>
      </ul>
    </li>

    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<h2 class="gallery-title">Elegant Mehndi Designs</h2>

<!-- EXACTLY 7 IMAGES -->
<div class="gallery">
  <img src="images/henna1.jpg" alt="Henna Design 1">
  <img src="images/henna2.jpg" alt="Henna Design 2">
  <img src="images/henna3.jpg" alt="Henna Design 3">
  <img src="images/henna4.jpg" alt="Henna Design 4">
  <img src="images/henna5.jpg" alt="Henna Design 5">
  <img src="images/henna6.jpg" alt="Henna Design 6">
  <img src="images/henna7.jpg" alt="Henna Design 7">
</div>

<!-- ZOOM -->
<div id="zoomModal">
  <span id="closeZoom">&times;</span>
  <img id="zoomImg">
  <div class="zoom-controls">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">−</button>
  </div>
</div>

<script>
let scale = 1;
const modal = document.getElementById("zoomModal");
const modalImg = document.getElementById("zoomImg");

document.querySelectorAll(".gallery img").forEach(img => {
  img.onclick = () => {
    modal.style.display = "flex";
    modalImg.src = img.src;
    scale = 1;
    modalImg.style.transform = "scale(1)";
  }
});

document.getElementById("closeZoom").onclick = () => {
  modal.style.display = "none";
};

function zoomIn() {
  scale += 0.2;
  modalImg.style.transform = `scale(${scale})`;
}

function zoomOut() {
  scale = Math.max(1, scale - 0.2);
  modalImg.style.transform = `scale(${scale})`;
}
</script>

</body>
</html>
