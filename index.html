<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<title>Dizz Henna Art | Professional Mehandhi Artist in Melur, Madurai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background-color: #f5e6d3;
    color: #4b2e1f;
}

/* ===== HEADER ===== */

.top-header {
    background-color: #6f4e37;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 40px;
    flex-wrap: wrap;
}

/* LOGO */
.header-left .logo {
    width: 75px;
    height: auto;
}

/* CENTER TEXT */
.header-center {
    text-align: center;
    flex: 1;
}

.header-center h1 {
    color: #fff5e1;
    margin: 0;
    font-size: 28px;
}

.header-center p {
    color: #f5e6d3;
    margin: 3px 0 0;
    font-size: 14px;
}

/* RIGHT CONTACT */
.header-right {
    text-align: right;
}

.header-right p {
    color: #f5e6d3;
    margin: 2px 0;
    font-size: 14px;
}

.header-right i {
    margin-right: 6px;
}

/* ===== NAVBAR ===== */

.navbar {
  background-color: #6b4a2d;
  padding: 10px 40px;
}

.menu {
  list-style: none;
  display: flex;
  gap: 30px;
  justify-content: center;
  margin: 0;
  padding: 0;
}

.menu li {
  position: relative;
}

.menu a {
  color: #fff;
  text-decoration: none;
  font-size: 18px;
  padding: 10px 0;
  display: block;
}

/* SUBMENU */
.submenu {
  display: none;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  background-color: #7a5432;
  min-width: 200px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.3);
  border-radius: 4px;
}

.submenu li {
  border-bottom: 1px solid #8b623e;
}

.submenu li:last-child {
  border-bottom: none;
}

.submenu a {
  padding: 12px 15px;
  color: #fff;
}

.submenu a:hover {
  background-color: #9c6b43;
}

.dropdown:hover .submenu {
  display: block;
}

/* ===== BANNER ===== */

.banner {
    width: 100%;
    height: 620px;
    position: relative;
    overflow: hidden;
}

.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.banner-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(0,0,0,0.4);
    padding: 20px 30px;
    border-radius: 12px;
}

.banner-text h2 {
    color: #fff5e1;
    font-size: 36px;
    margin: 0;
}

.banner-text p {
    color: #f5e6d3;
    font-size: 18px;
    margin-top: 8px;
}

/* ===== MOBILE ===== */

@media (max-width: 768px) {

    .top-header {
        flex-direction: column;
        text-align: center;
    }

    .header-right {
        text-align: center;
        margin-top: 5px;
    }

    .banner {
        height: 260px;
    }

    .banner-text h2 {
        font-size: 24px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="top-header">

    <div class="header-left">
        <!-- CHANGE logo.png TO YOUR LOGO FILE NAME -->
        <img src="Images/logo.png" alt="Dizz Henna Art Logo" class="logo">
    </div>

    <div class="header-center">
        <h1>Dizz Henna Art</h1>
        <p>Mehandhi Artist | Melur & Madurai</p>
    </div>

    <div class="header-right">
        <p><i class="fas fa-phone"></i> +91 94429 10175</p>
        <p><i class="fas fa-map-marker-alt"></i> Melur & Madurai</p>
    </div>

</header>

<!-- NAVIGATION -->
<nav class="navbar">
  <ul class="menu">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>

    <li class="dropdown">
      <a href="#">Services ▾</a>
      <ul class="submenu">
        <li><a href="#">Bridal Mehandi</a></li>
        <li><a href="#">Engagement Mehandi</a></li>
        <li><a href="#">Party Mehandi</a></li>
        <li><a href="#">Arabic Mehandi</a></li>
      </ul>
    </li>

    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- BANNER -->
<section class="banner">
    <img src="cover_02.jpg">
    <div class="banner-text">
        <h2>Elegant Mehandhi Designs</h2>
        <p>• Arabic • Wedding • Special Functions</p>
    </div>
</section>

</body>
</html>
